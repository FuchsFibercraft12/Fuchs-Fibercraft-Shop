<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Fuchs Fibercraft Platzhalterbild">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#a02ce6"/>
      <stop offset="1" stop-color="#ff4da6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0b0b0f" />

  <!-- stylisierter Fuchs-Kreis -->
  <g transform="translate(400 260)">
    <circle cx="0" cy="0" r="140" fill="url(#g)" filter="url(#glow)" opacity="0.95" />
    <path d="M-60 -10 L-10 -60 L0 -20 L10 -60 L60 -10 L30 0 L60 40 L10 30 L0 70 L-10 30 L-60 40 L-30 0 Z" fill="#0b0b0f" transform="scale(1.2)"/>
  </g>

  <!-- Marke -->
  <text x="50%" y="520" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="36" fill="url(#g)" font-weight="700">Fuchs Fibercraft</text>

  <!-- kleiner Hinweis -->
  <text x="50%" y="560" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="14" fill="#9b98a8">Platzhalterbild — ersetze durch Produktfoto</text>
</svg>
